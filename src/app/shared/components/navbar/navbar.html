<header class="encabezado">
  <div class="contenedor encabezado-contenido">
    <a class="marca" routerLink="/" aria-label="Ir al inicio de Dulce Esencia">
      <img class="marca-logo" src="/images/logo-dulce-esencia.jpg" alt="Logotipo de Dulce Esencia" />
      <span>
        <strong>Dulce Esencia</strong>
        <small>Momentos que saben mejor</small>
      </span>
    </a>

    <nav class="navegacion-principal navbar" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/productos" routerLinkActive="active-link">Productos</a>
      <a routerLink="/ofertas" routerLinkActive="active-link">Ofertas</a>
      <a routerLink="/tienda" routerLinkActive="active-link">Tienda</a>
      <a routerLink="/carrito" routerLinkActive="active-link">Carrito ({{ carrito.unidades() }})</a>
      <a routerLink="/contacto" routerLinkActive="active-link">Contacto</a>

      @if (authService.isAuthenticated()) {
        <a routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
        <button class="btn boton boton-secundario boton-nav" type="button" (click)="logout()">Cerrar sesión</button>
      } @else {
        <a routerLink="/mi-cuenta" routerLinkActive="active-link">Mi cuenta</a>
        <a routerLink="/login" routerLinkActive="active-link" class="btn boton boton-principal boton-nav">Login</a>
      }
    </nav>
  </div>
</header>
