<section class="seccion seccion-contacto pagina-interna">
  <div class="contenedor contacto-contenido">
    <div>
      <p class="etiqueta-seccion">Visítanos</p>
      <h2>Hablemos de algo dulce</h2>
      <p class="contacto-introduccion">Estamos listos para acompañar tus celebraciones y convertir tus ideas en deliciosos recuerdos.</p>
    </div>

    <div class="contacto-form-wrap">
      <form class="formulario-pedido formulario-contacto">
        <div class="campo-formulario">
          <label for="contacto-nombre">Nombre</label>
          <input id="contacto-nombre" type="text" placeholder="Tu nombre" />
        </div>
        <div class="campo-formulario">
          <label for="contacto-email">Correo</label>
          <input id="contacto-email" type="email" placeholder="tu@email.com" />
        </div>
        <div class="campo-formulario">
          <label for="contacto-asunto">Asunto</label>
          <input id="contacto-asunto" type="text" placeholder="¿Qué te gustaría pedir?" />
        </div>
        <div class="campo-formulario">
          <label for="contacto-mensaje">Mensaje</label>
          <textarea id="contacto-mensaje" rows="5" placeholder="Cuéntanos tus ideas..."></textarea>
        </div>
        <button class="boton boton-principal boton-formulario" type="button">Enviar mensaje</button>
      </form>
    </div>
  </div>
</section>

<section class="seccion seccion-blanco">
  <div class="contenedor">
    <div class="datos-contacto datos-contacto-page">
      <div class="dato-contacto">
        <span class="dato-icono" aria-hidden="true">☎</span>
        <div><span>Teléfono</span><a href="tel:+51999999999">+51 999 999 999</a></div>
      </div>
      <div class="dato-contacto">
        <span class="dato-icono" aria-hidden="true">@</span>
        <div><span>Correo</span><a href="mailto:contacto@dulceesencia.pe">contacto@dulceesencia.pe</a></div>
      </div>
      <div class="dato-contacto">
        <span class="dato-icono" aria-hidden="true">⌖</span>
        <div><span>Dirección</span><p>Av. Dulce Esencia 123, Lima</p></div>
      </div>
      <div class="dato-contacto">
        <span class="dato-icono" aria-hidden="true">◷</span>
        <div><span>Horario</span><p>Lunes a sábado<br>9:00 a.m. - 8:00 p.m.</p></div>
      </div>
    </div>
  </div>
</section>
