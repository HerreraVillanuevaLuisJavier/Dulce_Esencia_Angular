<section class="seccion pagina-interna">
  <div class="contenedor dashboard-wrap">
    <div class="dashboard-header">
      <div>
        <p class="etiqueta-seccion">Panel administrativo</p>
        <h2>Dashboard</h2>
      </div>
      <button class="boton boton-secundario" type="button" (click)="logout()">Cerrar sesión</button>
    </div>

    <div class="dashboard-card">
      <h3>Bienvenido, {{ authService.currentUser()?.name }}</h3>
      <p>Estás autenticado con la sesión de demostración. Aquí podrás continuar con futuras funciones administrativas.</p>
    </div>

    <div class="dashboard-grid">
      <article class="dashboard-stat">
        <span>Pedidos</span>
        <strong>24</strong>
        <small>Este mes</small>
      </article>
      <article class="dashboard-stat">
        <span>Clientes</span>
        <strong>180</strong>
        <small>Activos</small>
      </article>
      <article class="dashboard-stat">
        <span>Promociones</span>
        <strong>06</strong>
        <small>En campaña</small>
      </article>
    </div>
  </div>
</section>
